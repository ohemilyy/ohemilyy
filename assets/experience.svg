    @keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 40% { opacity: 0; transform: scale(2.6); } 100% { opacity: 0; transform: scale(2.6); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
