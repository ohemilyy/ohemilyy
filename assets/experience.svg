    .node-live { fill: #9D4EDD; stroke: #0F1120; stroke-width: 2; }
    .pulse { fill: none; stroke: #9D4EDD; stroke-width: 1.5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulse 3.6s cubic-bezier(0.16, 1, 0.3, 1) infinite both; }
    .p0 { animation-delay: 0ms; }
